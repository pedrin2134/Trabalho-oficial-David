<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body class="cadastro">

  <div class="box">

    <h1>Cadastro</h1>

<form action="login.html">

  <label for="nome">Nome</label>
  <input type="text" id="nome" placeholder="Seu nome" required>

  <label for="sobrenome">Sobrenome</label>
  <input type="text" id="sobrenome" placeholder="Seu sobrenome" required>

  <label for="iemail">Email</label>
  <input type="email" id="iemail" placeholder="Seu email" required>

  <label for="telefone">Telefone</label>
  <input type="tel" id="telefone" placeholder="Seu telefone" required>

  <label for="isenha">Crie uma senha</label>
  <input type="password" id="isenha" placeholder="Informe uma senha" required>

  <button class="env" type="submit">Cadastrar</button>

</form>

    <p>
      Já possui conta?
      <a  href="login.html">Fazer login</a>
    </p>

  </div>

</body>
</html>
