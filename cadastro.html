<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="cadastro">

  <div class="box">

    <h1>Cadastro</h1>


    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Seu nome">

    <label for="sobrenome">Sobrenome</label>
    <input type="text" id="sobrenome" placeholder="Seu sobrenome">

    <label for="iemail">Email</label>
    <input type="email" name="Email" id="iemail" placeholder="Seu email">

    <label for="telefone">Telefone</label>
    <input type="tel" id="telefone" placeholder="Seu telefone">

    <label for="isenha">Crie uma senha</label>
    <input type="password" name="senha" id="isenha" placeholder="Informe uma senha">

    <a class="loggue" href="Sistema de presença.html">Cadastre-se</a>

    <p>
      Já possui conta?
      <a  href="login.html">Fazer login</a>
    </p>

  </div>

</body>
</html>
